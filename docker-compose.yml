version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: vakt_resume_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./cv.txt:/usr/share/nginx/html/cv.txt:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
